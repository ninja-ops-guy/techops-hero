<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TechOps Hero</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>">
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">
    <div id="hud-left">
      <span id="hud-day"></span><span id="hud-clock"></span><span id="hud-zone"></span>
    </div>
    <div id="hud-right">
      <span id="hud-hp"></span><span id="hud-stress"></span><span id="hud-budget"></span><span id="hud-rep"></span><span id="hud-ticket"></span>
    </div>
  </div>
  <div id="objective" class="hidden"></div>
  <div id="toast"></div>
  <div id="dialogue" class="hidden">
    <div id="dlg-name"></div>
    <div id="dlg-text"></div>
    <div id="dlg-options"></div>
  </div>
  <div id="battle" class="hidden">
    <div id="battle-world"></div>
    <div id="battle-top">
      <div id="enemy-box">
        <div id="enemy-sprite"></div>
        <div id="enemy-info">
          <div id="enemy-name"></div>
          <div class="bar"><div id="enemy-hp" class="bar-fill hp"></div></div>
          <div class="bar"><div id="enemy-unc" class="bar-fill unc"></div></div>
        </div>
      </div>
      <div id="player-box">
        <div id="player-info">
          <div id="player-name-b"></div>
          <div class="bar"><div id="player-hp" class="bar-fill hp"></div></div>
          <div class="bar"><div id="player-conf" class="bar-fill conf"></div></div>
        </div>
      </div>
    </div>
    <div id="battle-log"></div>
    <div id="battle-menu"></div>
  </div>
  <div id="title-screen">
    <div id="title-emblem"></div>
    <h1>TECHOPS HERO</h1>
    <div id="title-sub">A ROGUELITE IT ODYSSEY</div>
    <div id="title-buttons">
      <button id="btn-start">▶ NEW GAME</button>
      <button id="btn-continue" class="hidden">↻ CONTINUE</button>
      <button id="btn-help">❓ HOW TO PLAY</button>
    </div>
    <div id="title-foot">keyboard: WASD/arrows + E · touch: drag to move, tap to interact</div>
  </div>
  <div id="eod-summary" class="hidden">
    <h2>SHIFT REPORT</h2>
    <div id="eod-body"></div>
    <div id="eod-rewards"></div>
  </div>
  <div id="panel" class="hidden">
    <div id="panel-title"></div>
    <div id="panel-body"></div>
    <button id="panel-close">✕</button>
  </div>
  <div id="touch-controls" class="hidden">
    <div id="stick-zone"><div id="stick-base"><div id="stick-nub"></div></div></div>
    <div id="touch-buttons">
      <button id="tb-a">E</button>
      <button id="tb-b">☰</button>
    </div>
  </div>
</div>
