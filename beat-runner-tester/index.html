function initAudio(){try{audioCtx=new (AudioContext||webkitAudioContext)();setInterval(function(){if(gameStarted&&!gameOver)tone(60,.1,.2)},500)}catch(e){console.log('Audio not available')}}function tone(freq,dur,gain){if(!audioCtx)return;var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=freq;g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur);beatPulse=1}function startGame(){startScreen.style.display='none';gameStarted=true;initAudio();if(!isMobile&&gameCanvas.requestPointerLock)gameCanvas.requestPointerLock()}

function updatePlayer(delta){if(!player||gameOver)return;var sp=(keys.shift?.25:.15)*(delta*60),mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),jx=0,jy=0;if(isMobile&&window.joystickX){jx=window.joystickX();jy=window.joystickY()}var dx=(mx+jx)*Math.cos(cameraAngle)-(mz+jy)*Math.sin(cameraAngle),dz=-(mx+jx)*Math.sin(cameraAngle)-(mz+jy)*Math.cos(cameraAngle);player.position.x+=dx*sp;player.position.z+=dz*sp;velocity.y-=.02*(delta*60);player.position.y+=velocity.y*(delta*60);onGround=false;for(var i=0;i<platforms.length;i++){var p=platforms[i],py=player.position.y;if(player.position.x>p.x-p.w/2&&player.position.x<p.x+p.w/2&&player.position.z>p.z-p.d/2&&player.position.z<p.z+p.d/2){var top=p.y+p.h/2;if(py<top&&py>top-1&&velocity.y<=0){player.position.y=top;velocity.y=0;onGround=true}}}if(player.position.y<=0){player.position.y=0;velocity.y=0;onGround=true}if(keys[' ']&&onGround){velocity.y=.35;onGround=false}if(keys.j)performAttack();attackCooldown=Math.max(0,attackCooldown-delta);var ud=player.userData,moving=Math.abs(dx)>.01||Math.abs(dz)>.01;if(moving){ud.walkCycle+=delta*10;var ta=Math.atan2(dx,dz),diff=ta-player.rotation.y;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;player.rotation.y+=diff*.2;ud.legL.rotation.x=Math.sin(ud.walkCycle)*.5;ud.legR.rotation.x=-Math.sin(ud.walkCycle)*.5;ud.armL.rotation.x=-Math.sin(ud.walkCycle)*.3;ud.armR.rotation.x=Math.sin(ud.walkCycle)*.3}else{ud.legL.rotation.x*=.9;ud.legR.rotation.x*=.9;ud.armL.rotation.x*=.9;ud.armR.rotation.x*=.9;ud.torso.position.y=1.5+Math.sin(Date.now()*.003)*.02}if(ud.attacking){ud.attackTime+=delta;ud.armR.rotation.x=-2+Math.sin(ud.attackTime*20)*.5;if(ud.attackTime>.3){ud.attacking=false;ud.armR.rotation.x=0}}beatPulse*=.95;ud.glow.material.opacity=.1+beatPulse*.15;ud.glow.scale.setScalar(1+beatPulse*.2);player.position.x=Math.max(-45,Math.min(45,player.position.x));player.position.z=Math.max(-45,Math.min(4 function updateGems(){for(var i=gems.length-1;i>=0;i--){var g=gems[i];g.rotation.y+=g.userData.spin;g.position.y+=Math.sin(Date.now()*.002+g.userData.bobOffset)*.005;if(player.position.distanceTo(g.position)<1.5){scene.remove(g);gems.splice(i,1);score+=10;combo++;comboTimer=3;tone(660,.12,.15);updateUI();var s=new THREE.Mesh(new THREE.SphereGeometry(.5,8,8),new THREE.MeshBasicMaterial({color:0x00ff88,transparent:true,opacity:.8}));s.position.copy(g.position);s.userData.life=1;s.userData.isSparkle=true;scene.add(s);particles.push(s)}}if(gems.length<5)createGems()}
function updateParticles(delta){for(var i=particles.length-1;i>=0;i--){var p=particles[i];if(p.userData.life!==undefined){p.userData.life-=delta*2;if(p.material)p.material.opacity=p.userData.life;if(p.userData.velocity)p.position.add(p.userData.velocity);else p.position.y+=.01;p.scale.setScalar(Math.max(.01,p.userData.life));if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}}else if(p.userData.floatSpeed){p.position.y+=Math.sin(Date.now()*.001+p.userData.floatOffset)*p.userData.floatSpeed;p.rotation.y+=.01}}}
function updateCamera(){if(!player)return;var d=8,h=4+cameraPitch*5,tx=player.position.x+Math.sin(cameraAngle)*d,tz=player.position.z+Math.cos(cameraAngle)*d;camera.position.lerp(new THREE.Vector3(tx,player.position.y+h,tz),.1);camera.lookAt(player.position.x,player.position.y+2,player.position.z)}function updateMinimap(){if(!player)return;var c=minimap,x=c.getContext('2d'),w=120;c.width=c.height=w;x.fillStyle='rgba(0,0,0,.8)';x.fillRect(0,0,w,w);var sc=w/100;x.fillStyle='#00ff88';gems.forEach(function(g){x.beginPath();x.arc(60+g.position.x*sc,60+g.position.z*sc,2,0,Math.PI*2);x.fill()});x.fillStyle='#ff0000';enemies.forEach(function(e){x.beginPath();x.arc(60+e.position.x*sc,60+e.position.z*sc,3,0,Math.PI*2);x.fill()});x.fillStyle='#fff';x.beginPath();x.arc(60+player.position.x*sc,60+player.position.z*sc,4,0,Math.PI*2);x.fill()}function updateUI(){document.getElementById('score').textContent='💎 '+score;document.getElementById('health').textContent='❤️ '+Math.max(0,health);var c=document.getElementById('combo');if(combo>1){c.textContent='COMBO x'+combo+'!';c.style.fontSize=(18+combo*2)+'px'}else c.textContent=''}function showMessage(t){var m=message;m.textContent=t;m.style.display='block';if(t==='GAME OVER')m.innerHTML=t+'<br><span style="font-size:24px">Final Score: '+score+'</span><br><br><button onclick="location.reload()" style="padding:10px 30px;font-size:20px;background:#00ff88;border:0;cursor:pointer;font-family:monospace">PLAY AGAIN</button>'}
function animate(time){requestAnimationFrame(animate);var delta=Math.min((time-lastTime)/1000,.1)||0;lastTime=time;if(gameStarted&&!gameOver){updatePlayer(delta);updateEnemies(delta);updateGems();if(comboTimer>0){comboTimer-=delta;if(comboTimer<=0){combo=0;updateUI()}}}updateParticles(delta);updateCamera();updateMinimap();renderer.render(scene,camera)}
addEventListener('resize',function(){if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});init();
});
</script>
