name: Integrate open PRs
on:
  push:
    branches: [integrate/open-prs-20260912]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reconcile PR 26 and PR 28 onto reviewed main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/gameplay-feedback-workday-pass fix/live-crawl-visual-cohesion
          git merge --no-ff -X ours origin/feat/gameplay-feedback-workday-pass -m "Integrate PR #26 gameplay quality pass onto reviewed main"
          git merge --no-ff -X ours origin/fix/live-crawl-visual-cohesion -m "Integrate PR #28 live-crawl cohesion fixes onto reviewed main"
      - name: Resolve reviewed overlap contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("index.html")
          s=p.read_text()
          for src,ver in [
              ("campaign_story.js","20260912-gameplay-feedback-r1"),
              ("campaign_act1.js","20260912-gameplay-feedback-r1"),
              ("campaign_native_act1.js","20260912-gameplay-feedback-r1"),
          ]:
              pattern=r'(<script src="'+re.escape(src)+r')(?:\?v=[^"]+)?("></script>)'
              s,n=re.subn(pattern,lambda m:m.group(1)+"?v="+ver+m.group(2),s,count=1)
              if n != 1:
                  raise SystemExit(f"entrypoint marker missing or duplicated: {src} ({n})")
          p.write_text(s)

          p=Path("good_boys_reference_ui_v1.js")
          s=p.read_text()
          old='var use=root.document.getElementById("gb-use");if(use)use.textContent=(use.dataset.context==="1"?"E   USE · CELL 118":"E   USE / INTERACT");'
          if old in s:
              s=s.replace(old,'',1)
          elif 'USE · CELL 118' in s:
              raise SystemExit("unexpected Good Dogs mission-label override remains")
          p.write_text(s)

          p=Path("production_bootstrap.js")
          s=p.read_text()
          if '"visual_cohesion_live_crawl.js"' not in s:
              anchor='"good_boys_reference_ui_v1.js",'
              if anchor not in s:
                  raise SystemExit("production bootstrap anchor missing")
              s=s.replace(anchor,anchor+'\n    "visual_cohesion_live_crawl.js",',1)
          p.write_text(s)
          PY
      - name: Static and aggregate validation
        run: |
          set +e
          mkdir -p artifacts/open-pr-integration
          node scripts/production_release_gate.js 2>&1 | tee artifacts/open-pr-integration/production-release-gate.log
          s1=${PIPESTATUS[0]}
          if test -f test_quality_integration.js; then node test_quality_integration.js 2>&1 | tee artifacts/open-pr-integration/quality.log; s2=${PIPESTATUS[0]}; else s2=0; fi
          if test -f test_live_crawl_visual_cohesion.js; then node test_live_crawl_visual_cohesion.js 2>&1 | tee artifacts/open-pr-integration/live-crawl.log; s3=${PIPESTATUS[0]}; else s3=0; fi
          if test -f test_runtime_combat_audio.js; then node test_runtime_combat_audio.js 2>&1 | tee artifacts/open-pr-integration/combat-audio.log; s4=${PIPESTATUS[0]}; else s4=0; fi
          if test -f test_campaign_workday_followups.js; then node test_campaign_workday_followups.js 2>&1 | tee artifacts/open-pr-integration/workday.log; s5=${PIPESTATUS[0]}; else s5=0; fi
          printf 'release=%s\nquality=%s\nlive_crawl=%s\ncombat_audio=%s\nworkday=%s\n' "$s1" "$s2" "$s3" "$s4" "$s5" > artifacts/open-pr-integration/status.txt
          if [ "$s1" -ne 0 ] || [ "$s2" -ne 0 ] || [ "$s3" -ne 0 ] || [ "$s4" -ne 0 ] || [ "$s5" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-pr-integration-${{ github.sha }}
          path: artifacts/open-pr-integration/
          retention-days: 7
      - name: Remove temporary workflow and publish reconciled branch
        run: |
          set -euo pipefail
          git add index.html good_boys_reference_ui_v1.js production_bootstrap.js
          git commit -m "Reconcile reviewed PR overlap contracts"
          git rm .github/workflows/integrate-open-prs.yml
          git commit -m "Remove temporary integration workflow"
          git push origin HEAD:integrate/open-prs-20260912
