name: Integrate open PRs
on:
  push:
    branches: [integrate/open-prs-20260912]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reconcile PR 26 and PR 28 onto reviewed main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/gameplay-feedback-workday-pass fix/live-crawl-visual-cohesion
          git merge --no-ff -X ours origin/feat/gameplay-feedback-workday-pass -m "Integrate PR #26 gameplay quality pass onto reviewed main"
          git merge --no-ff -X ours origin/fix/live-crawl-visual-cohesion -m "Integrate PR #28 live-crawl cohesion fixes onto reviewed main"
      - name: Resolve reviewed overlap contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          CACHE="20260912-integrated-r1"
          BUILD="20260912-production-v34-integrated-r1"

          p=Path("index.html"); s=p.read_text()
          for src in ("campaign_story.js","campaign_act1.js","campaign_native_act1.js"):
              s,n=re.subn(r'src="'+re.escape(src)+r'(?:\?v=[^"]*)?"','src="'+src+'?v='+CACHE+'"',s,count=1)
              if n != 1: raise SystemExit(f"entrypoint marker missing: {src}")
          p.write_text(s)

          p=Path("good_boys_reference_ui_v1.js"); s=p.read_text()
          s=s.replace('function active(){return !!cs();}','function active(){try{var n=root.NM,s=root.S;return !!(n&&n._v736&&s&&!s.gameOver&&(s.nightMode===n||s.nightMode===true));}catch(e){return false;}}',1)
          s=s.replace('var use=root.document.getElementById("gb-use");if(use)use.textContent=(use.dataset.context==="1"?"E   USE · CELL 118":"E   USE / INTERACT");','',1)
          if '#good-boys-board-ship' not in s:
              anchor='"body.good-boys-reference-ui #good-dogs-touch button:active{transform:translateY(2px) scale(.98)!important;filter:brightness(1.3)!important}",'
              addition='"body.good-boys-reference-ui #good-boys-board-ship{box-sizing:border-box!important;max-width:min(68vw,360px)!important;min-height:48px!important;padding:10px 18px!important;font-size:clamp(11px,2.2vw,16px)!important;letter-spacing:.12em!important;border-width:2px!important;border-radius:12px!important;box-shadow:0 10px 26px rgba(0,0,0,.46)!important}",\n    "@media(max-width:560px){body.good-boys-reference-ui #good-boys-board-ship{max-width:54vw!important;min-height:42px!important;padding:8px 12px!important;font-size:11px!important}body.good-boys-reference-ui #dpad{transform:scale(.78)!important}}",'
              if anchor not in s: raise SystemExit("Good Dogs HUD anchor missing")
              s=s.replace(anchor,anchor+'\n    '+addition,1)
          if 'USE · CELL 118' in s: raise SystemExit("stale Cell 118 override remains")
          p.write_text(s)

          p=Path("production_bootstrap.js"); s=p.read_text()
          s=re.sub(r'/\* TechOps Hero — production runtime bootstrap v\d+\.', '/* TechOps Hero — production runtime bootstrap v34.', s, count=1)
          s=re.sub(r'var VERSION=\d+,BUILD="[^"]+"','var VERSION=34,BUILD="'+BUILD+'"',s,count=1)
          for f in ("runtime_combat_audio.js","production_gameplay_experience.js","orbital_scene_staging.js"):
              if '"'+f+'"' not in s:
                  anchor='"state_validator.js",'
                  if anchor not in s: raise SystemExit("bootstrap state anchor missing")
                  s=s.replace(anchor,anchor+'\n    "'+f+'",',1)
          if '"visual_cohesion_live_crawl.js"' not in s:
              anchor='"good_boys_reference_ui_v1.js",'
              if anchor not in s: raise SystemExit("bootstrap UI anchor missing")
              s=s.replace(anchor,anchor+'\n    "visual_cohesion_live_crawl.js",',1)
          p.write_text(s)

          p=Path("bg_noc.js"); s=p.read_text(); s=re.sub(r'var BUILD="[^"]+"','var BUILD="'+BUILD+'"',s,count=1); p.write_text(s)

          p=Path("test_campaign_browser_entrypoint.js"); s=p.read_text().replace("20260912-gameplay-feedback-r1",CACHE)
          new='''function scriptIndex(src) {\n  const bare = src.split("?")[0];\n  const marker = `src="${bare}`;\n  const index = html.indexOf(marker);\n  assert.notStrictEqual(index, -1, `${bare} must be loaded by index.html`);\n  return index;\n}'''
          s,n=re.subn(r'function scriptIndex\(src\) \{.*?\n\}',lambda _:new,s,count=1,flags=re.S)
          if n != 1: raise SystemExit("campaign browser scriptIndex missing")
          p.write_text(s)

          p=Path("test_good_boys_ship_deck_mapping.js"); s=p.read_text().replace("20260912-gameplay-feedback-r1",CACHE); p.write_text(s)

          p=Path("test_static_entrypoint_integrity.js"); s=p.read_text()
          s=s.replace('["good_boys_access_core_authority.js","cinematic_systems.js","good_boys_progression_authority.js","v736_hooks.js","katrin_manchez.atlas.js","campaign_story.js"]','["good_boys_access_core_authority.js","cinematic_systems.js","good_boys_progression_authority.js","v736_hooks.js","katrin_manchez.atlas.js"]')
          marker='for(const src of ["campaign_world_visuals.js"])assert.strictEqual(refFor(src),src+"?v=20260912-night-combat-r1");'
          if marker not in s: raise SystemExit("static cache anchor missing")
          s=s.replace(marker,marker+'\nfor(const src of ["campaign_story.js","campaign_act1.js","campaign_native_act1.js"])assert.strictEqual(refFor(src),src+"?v='+CACHE+'");',1)
          s=s.replace(', "campaign_native_act1.js", "campaign_native_act2.js",', ', "campaign_native_act2.js",')
          p.write_text(s)

          p=Path("test_quality_integration.js"); s=p.read_text()
          s=s.replace('assert.match(src,/TechOpsNightFlow\\.install\\(\\)/);','assert.equal(r.TechOpsProductionBootstrap.FILES.filter(x=>x==="runtime_night.js").length,1);')
          s=s.replace("'test_runtime_night.js'","'test_night_lifecycle.js'")
          p.write_text(s)

          p=Path("test_live_crawl_visual_cohesion.js"); s=p.read_text().replace("bootstrap.includes('VERSION=32')","bootstrap.includes('VERSION=34')"); p.write_text(s)

          p=Path("scripts/production_release_gate.js"); s=p.read_text()
          anchor='  "test_night_lifecycle.js",'
          if anchor not in s: raise SystemExit("Night lifecycle release-gate anchor missing")
          additions=[
              '  "test_campaign_investigation_integrity.js",',
              '  "test_campaign_workday_followups.js",',
              '  "test_campaign_workday_followups_ui.js",',
              '  "test_runtime_combat_audio.js",',
              '  "test_quality_integration.js",',
              '  "test_production_gameplay_experience.js",',
              '  "test_orbital_scene_staging.js",',
          ]
          for line in additions:
              if line not in s:
                  s=s.replace(anchor,line+'\n'+anchor,1)
          p.write_text(s)
          PY
      - name: Static and aggregate validation
        run: |
          set +e
          mkdir -p artifacts/open-pr-integration
          node scripts/production_release_gate.js 2>&1 | tee artifacts/open-pr-integration/production-release-gate.log
          s1=${PIPESTATUS[0]}
          node test_quality_integration.js 2>&1 | tee artifacts/open-pr-integration/quality.log; s2=${PIPESTATUS[0]}
          node test_live_crawl_visual_cohesion.js 2>&1 | tee artifacts/open-pr-integration/live-crawl.log; s3=${PIPESTATUS[0]}
          node test_runtime_combat_audio.js 2>&1 | tee artifacts/open-pr-integration/combat-audio.log; s4=${PIPESTATUS[0]}
          node test_campaign_workday_followups.js 2>&1 | tee artifacts/open-pr-integration/workday.log; s5=${PIPESTATUS[0]}
          printf 'release=%s\nquality=%s\nlive_crawl=%s\ncombat_audio=%s\nworkday=%s\n' "$s1" "$s2" "$s3" "$s4" "$s5" > artifacts/open-pr-integration/status.txt
          if [ "$s1" -ne 0 ] || [ "$s2" -ne 0 ] || [ "$s3" -ne 0 ] || [ "$s4" -ne 0 ] || [ "$s5" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-pr-integration-${{ github.sha }}
          path: artifacts/open-pr-integration/
          retention-days: 7
      - name: Remove temporary workflow and publish reconciled branch
        run: |
          set -euo pipefail
          git add index.html good_boys_reference_ui_v1.js production_bootstrap.js bg_noc.js scripts/production_release_gate.js test_campaign_browser_entrypoint.js test_good_boys_ship_deck_mapping.js test_static_entrypoint_integrity.js test_quality_integration.js test_live_crawl_visual_cohesion.js
          git commit -m "Reconcile reviewed PR overlap contracts"
          git rm .github/workflows/integrate-open-prs.yml
          git commit -m "Remove temporary integration workflow"
          git push origin HEAD:integrate/open-prs-20260912
