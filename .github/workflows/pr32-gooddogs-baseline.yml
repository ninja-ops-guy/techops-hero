name: PR32 Good Dogs baseline diagnostic
on:
  push:
    branches: [integrate/pr29-on-main-20260912]
permissions:
  contents: read
jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start main baseline server
        run: |
          set -euo pipefail
          nohup npx http-server . -p 4173 -c-1 > /tmp/techops-main-http.log 2>&1 &
          echo $! > /tmp/techops-main-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/techops-main-http.log || true
          exit 1
      - name: Run unchanged main Good Dogs progression
        run: node scripts/good_boys_progression_bot.mjs
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/techops-main-http.pid ]; then kill "$(cat /tmp/techops-main-http.pid)" || true; fi
