name: Arena prototype qualification
on:
  pull_request:
    paths:
      - 'arena/**'
      - 'scripts/arena_pvp_browser.mjs'
      - 'scripts/arena_core_browser.mjs'
      - 'package*.json'
      - '.github/workflows/arena-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record exact source identity
        run: |
          git rev-parse HEAD HEAD^{tree}
          sha256sum arena/*.cjs arena/*.js arena/index.html scripts/arena_pvp_browser.mjs scripts/arena_core_browser.mjs
      - name: Protocol, simulation and client regressions
        run: npm run test:arena
      - name: Campaign regression gate
        run: npm test
      - run: npx --no-install playwright install --with-deps chromium webkit
      - name: Node, Chromium and WebKit core replay parity
        run: npm run test:browser:arena-core
        env:
          ARENA_CORE_ARTIFACT_DIR: /tmp/arena-core
      - name: Two isolated browser clients
        run: npm run test:browser:arena
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-prototype-${{ github.sha }}
          path: |
            /tmp/arena-pvp/
            /tmp/arena-core/
          if-no-files-found: warn
