name: Stabilize PR32 air combo
on:
  push:
    branches: [integrate/pr29-on-main-20260912]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply evidence-backed air reach tolerance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('night_combat.js')
          s=p.read_text()
          old="air:Object.freeze({damage:14,reach:88,windup:70,recovery:230})"
          new="air:Object.freeze({damage:14,reach:112,windup:70,recovery:230})"
          if old not in s:
              raise SystemExit('air move contract not found or already changed')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check night_combat.js
          node test_night_directional_combat.js
          node test_night_directional_physics.js
          node test_night_directional_integration.js
          node test_runtime_combat_audio.js
          git add night_combat.js
          git commit -m "Stabilize cross-browser aerial combo contact"
          git rm .github/workflows/pr32-air-combo-stability.yml
          git commit -m "Remove temporary air-combo stability workflow"
          git push origin HEAD:integrate/pr29-on-main-20260912
