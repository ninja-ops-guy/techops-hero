name: Day device experience
on:
  pull_request:
    paths:
      - 'runtime_day*'
      - 'campaign_world_visuals.js'
      - 'campaign_native_act1.js'
      - 'campaign_act1_investigations.js'
      - 'game.js'
      - 'index.html'
      - 'scripts/day_device_acceptance_browser.mjs'
      - 'scripts/day_device_playthrough_browser.mjs'
      - 'test_campaign_world_visuals.js'
      - 'scripts/lib/doors_workstation.mjs'
      - 'test_day_*presentation.js'
      - 'test_day_doors_shell.js'
      - '.github/workflows/day-device-experience.yml'
permissions:
  contents: read
jobs:
  field-experience:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify spatial, state, and audio boundaries
        run: |
          node test_runtime_day_cases.js
          node test_runtime_day_world.js
          node test_runtime_day_audio.js
          node test_runtime_day_experience.js
          node test_day_plating_presentation.js
          node test_day_security_presentation.js
          node test_day_doors_shell.js
          npm test
      - name: Capture actual device interactions
        env:
          DAY_DEVICE_OUT_DIR: runtime-bot-artifacts/day-devices
        run: node scripts/day_device_acceptance_browser.mjs
      - name: Run unassisted Day 1 Shipping routes
        run: |
          set -euo pipefail
          DAY_PLAYTHROUGH_PROFILE=desktop DAY_PLAYTHROUGH_WIDTH=1280 DAY_PLAYTHROUGH_HEIGHT=800 DAY_PLAYTHROUGH_TOUCH=0 DAY_PLAYTHROUGH_OUT_DIR=runtime-bot-artifacts/day-routes/desktop node scripts/day_device_playthrough_browser.mjs
          DAY_PLAYTHROUGH_PROFILE=portrait DAY_PLAYTHROUGH_WIDTH=390 DAY_PLAYTHROUGH_HEIGHT=844 DAY_PLAYTHROUGH_TOUCH=1 DAY_PLAYTHROUGH_OUT_DIR=runtime-bot-artifacts/day-routes/portrait node scripts/day_device_playthrough_browser.mjs
          DAY_PLAYTHROUGH_PROFILE=compact DAY_PLAYTHROUGH_WIDTH=320 DAY_PLAYTHROUGH_HEIGHT=568 DAY_PLAYTHROUGH_TOUCH=1 DAY_PLAYTHROUGH_OUT_DIR=runtime-bot-artifacts/day-routes/compact node scripts/day_device_playthrough_browser.mjs
          DAY_PLAYTHROUGH_PROFILE=landscape DAY_PLAYTHROUGH_WIDTH=844 DAY_PLAYTHROUGH_HEIGHT=390 DAY_PLAYTHROUGH_TOUCH=1 DAY_PLAYTHROUGH_OUT_DIR=runtime-bot-artifacts/day-routes/landscape node scripts/day_device_playthrough_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day-device-${{ github.event.pull_request.head.sha }}
          path: runtime-bot-artifacts/
          retention-days: 7
