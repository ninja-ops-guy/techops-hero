name: Fix Good Boys direct v5 contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-good-boys-direct-v5-contract.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch direct intro contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('test_static_entrypoint_integrity.js')
          q=t.read_text()
          start=q.index("assert.ok(introSource.includes('dataset.gbdBypass=\"1\"')")
          end=q.index("\n\nconst bridgeSource",start)
          lines=[]
          lines.append("assert.ok(introSource.includes('dataset.gbdBypass=\"1\"'), \"direct intro must bypass the legacy director start interceptor\");")
          lines.append("assert.ok(introSource.includes('GoodDogsCutscenes.play(\"GD_CUT_01\")'), \"Good Boys must open with the exact source-master GD_CUT_01 cinematic\");")
          lines.append("assert.ok(!introSource.includes('SCENES=['), \"retired four-card preamble must not return\");")
          lines.append("assert.ok(introSource.includes('e.stopImmediatePropagation()'), \"direct intro launch must isolate the title click from legacy delegated listeners\");")
          lines.append("assert.ok(introSource.includes('start.click()'), \"direct intro must use canonical CLOCK IN state initialization after the movie\");")
          lines.append("assert.ok(introSource.includes('root.v736.start()'), \"direct intro must hand off into the canonical Good Boys campaign\");")
          lines.append("assert.ok(introSource.includes('function verify(attempt)'), \"direct intro must verify campaign attachment after the movie\");")
          lines.append("assert.ok(introSource.includes('attempt<2'), \"direct intro attachment retry must remain bounded\");")
          t.write_text(q[:start]+"\n".join(lines)+q[end:])
          p=Path('index.html')
          s=p.read_text()
          for old in ['good_boys_intro_repair.js?v=20260901-goodboys-intro-v4','good_boys_intro_repair.js?v=20260831-goodboys-intro-v4']:
              if old in s:
                  s=s.replace(old,'good_boys_intro_repair.js?v=20260901-goodboys-direct-intro-v5',1)
                  break
          if 'good_boys_intro_repair.js?v=20260901-goodboys-direct-intro-v5' not in s:
              raise SystemExit('direct intro cache key not present')
          p.write_text(s)
          PY
          node test_good_boys_intro_repair.js
          node test_static_entrypoint_integrity.js
      - name: Commit guarded contract
        run: |
          rm .github/workflows/fix-good-boys-direct-v5-contract.yml
          rm -f .github/workflows/bump-good-boys-direct-v5-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html test_static_entrypoint_integrity.js .github/workflows/fix-good-boys-direct-v5-contract.yml .github/workflows/bump-good-boys-direct-v5-cache.yml
          git commit -m 'Align production checks with direct Good Dogs opening'
          git push origin HEAD:main
