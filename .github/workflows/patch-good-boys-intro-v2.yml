name: Patch Good Boys intro v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-good-boys-intro-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch intro ownership and deferred launch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('good_boys_intro_repair.js')
          s=p.read_text()
          s=s.replace('/* TechOps Hero — Good Boys intro repair v1', '/* TechOps Hero — Good Boys intro repair v2')
          s=s.replace('var VERSION=1;', 'var VERSION=2;')
          s=s.replace('var overlay=null,style=null;', 'var overlay=null,style=null,dialogLock=null;')
          old='''  function setDialog(on){try{if(root.S)root.S.inDialog=!!on;}catch(_){} }\n  function cleanup(){\n    if(watchdog){root.clearTimeout(watchdog);watchdog=null;}\n    try{if(overlay&&overlay.parentNode)overlay.remove();}catch(_){}\n    overlay=null;active=false;advancing=false;\n    try{if(root.document&&root.document.body)root.document.body.classList.remove("good-boys-cinematic");}catch(_){}\n    setDialog(false);\n  }'''
          new='''  function gameState(){try{return root.S||null;}catch(_){return null;}}\n  function lockDialog(){\n    try{\n      var s=gameState();if(!s)return false;\n      if(dialogLock&&dialogLock.state===s){try{s.inDialog=true;}catch(_){}return true;}\n      unlockDialog(false);\n      var d=Object.getOwnPropertyDescriptor(s,"inDialog"),backing=!!s.inDialog;\n      if(!d||d.configurable){\n        dialogLock={state:s,descriptor:d,backing:backing};\n        Object.defineProperty(s,"inDialog",{configurable:true,enumerable:d?d.enumerable:true,get:function(){return active?true:!!(dialogLock&&dialogLock.backing);},set:function(v){if(dialogLock)dialogLock.backing=!!v;}});\n        return true;\n      }\n      s.inDialog=true;return false;\n    }catch(e){root.__goodBoysIntroDialogLockError=String(e&&e.stack||e);return false;}\n  }\n  function unlockDialog(next){\n    var l=dialogLock;dialogLock=null;\n    if(!l){try{var s=gameState();if(s)s.inDialog=!!next;}catch(_){}return;}\n    try{\n      if(l.descriptor){\n        var d=l.descriptor;\n        if(Object.prototype.hasOwnProperty.call(d,"value")){d.value=!!next;Object.defineProperty(l.state,"inDialog",d);}\n        else{Object.defineProperty(l.state,"inDialog",d);try{l.state.inDialog=!!next;}catch(_){}}\n      }else{delete l.state.inDialog;l.state.inDialog=!!next;}\n    }catch(e){try{l.state.inDialog=!!next;}catch(_){}root.__goodBoysIntroDialogUnlockError=String(e&&e.stack||e);}\n  }\n  function setDialog(on){if(on){if(!lockDialog()){try{var s=gameState();if(s)s.inDialog=true;}catch(_){}}}else unlockDialog(false);}\n  function cleanup(){\n    if(watchdog){root.clearTimeout(watchdog);watchdog=null;}\n    try{if(overlay&&overlay.parentNode)overlay.remove();}catch(_){}\n    overlay=null;active=false;advancing=false;\n    try{if(root.document&&root.document.body)root.document.body.classList.remove("good-boys-cinematic");}catch(_){}\n    unlockDialog(false);\n  }'''
          if old not in s: raise SystemExit('dialog block not found')
          s=s.replace(old,new)
          old2='''  function launchCampaign(){\n    if(launching||campaignAttached())return;\n    launching=true;cleanup();ensureBuiltinM1Skip();invokeStart();watchdog=root.setTimeout(function(){verifyLaunch(0);},250);\n  }'''
          new2='''  function launchCampaign(){\n    if(launching||campaignAttached())return false;\n    launching=true;cleanup();\n    /* Return from the user gesture before v736.start performs the shared Night\n       handoff. iOS/WebKit otherwise keeps the final button gesture pending while\n       synchronous campaign bootstrap work runs, presenting as a dead CTA. */\n    (root.setTimeout||setTimeout)(function(){\n      ensureBuiltinM1Skip();\n      if(!invokeStart()){launching=false;root.__goodBoysIntroRepairLaunch={ok:false,attempt:0,at:Date.now(),error:root.__goodBoysIntroRepairStartError||"v736 start missing"};return;}\n      watchdog=root.setTimeout(function(){verifyLaunch(0);},250);\n    },0);\n    return true;\n  }'''
          if old2 not in s: raise SystemExit('launch block not found')
          s=s.replace(old2,new2)
          p.write_text(s)

          t=Path('test_good_boys_intro_repair.js')
          q=t.read_text()
          anchor='assert.ok(source.includes(\'if(advancing||!active)return\'), "slide progression must reject double taps/re-entrancy");\n'
          extra='''assert.ok(source.includes('Object.defineProperty(s,"inDialog"'), "intro must own the authoritative dialogue lock while visible");\nassert.ok(source.includes('get:function(){return active?true:'), "legacy writers must not clear the intro dialogue lock");\n'''
          if extra not in q:
              if anchor not in q: raise SystemExit('test anchor missing')
              q=q.replace(anchor,anchor+extra)
          anchor2='assert.ok(source.includes(\'root.__gbiSkipBuiltinM1=true\'), "legacy duplicate mission-1 cinematic must be skipped during repaired handoff");\n'
          extra2='''assert.ok(source.includes('(root.setTimeout||setTimeout)(function(){'), "final CTA must defer heavy campaign bootstrap until after the tap event returns");\n'''
          if extra2 not in q:
              if anchor2 not in q: raise SystemExit('launch test anchor missing')
              q=q.replace(anchor2,anchor2+extra2)
          t.write_text(q)
          PY
          node --check good_boys_intro_repair.js
          node test_good_boys_intro_repair.js
      - name: Commit production fix
        run: |
          rm .github/workflows/patch-good-boys-intro-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add good_boys_intro_repair.js test_good_boys_intro_repair.js .github/workflows/patch-good-boys-intro-v2.yml
          git commit -m 'Fix Good Boys intro input ownership on iOS'
          git push origin HEAD:main