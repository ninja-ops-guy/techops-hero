name: Night lifecycle validation
on:
  push:
    branches: [fix/night-walker-lifecycle]
  pull_request:
    paths:
      - '**.js'
      - 'scripts/night_lifecycle_browser.mjs'
      - 'scripts/night_browser_limits.mjs'
      - 'index.html'
      - '.github/workflows/night-lifecycle-validation.yml'
permissions:
  contents: read
concurrency:
  group: night-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Production and lifecycle regression gate
        run: |
          mkdir -p artifacts/night-lifecycle
          node scripts/production_release_gate.js | tee artifacts/night-lifecycle/production-gate.log
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser acceptance
        run: timeout 480s node --import ./scripts/night_browser_limits.mjs scripts/night_lifecycle_browser.mjs
      - name: Tested source identity
        if: always()
        run: |
          mkdir -p artifacts/night-lifecycle
          git rev-parse HEAD > artifacts/night-lifecycle/tested-commit.txt
          sha256sum runtime_night.js scripts/night_lifecycle_browser.mjs > artifacts/night-lifecycle/source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: night-lifecycle-browser-evidence
          path: artifacts/night-lifecycle
          retention-days: 7
