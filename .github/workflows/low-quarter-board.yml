name: Low Quarter board acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'campaign_*.js'
      - 'chapters_vii_x.js'
      - 'state_validator.js'
      - 'game.js'
      - 'production_*.js'
      - 'index.html'
      - '*.css'
      - 'test_campaign_low_quarter.js'
      - 'scripts/low_quarter_browser.mjs'
      - 'scripts/media_http_server.py'
      - 'package*.json'
      - '.github/workflows/low-quarter-board.yml'

permissions:
  contents: read

concurrency:
  group: low-quarter-board-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  board:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LOW_QUARTER_BASE_URL: http://127.0.0.1:4208/
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Bind evidence to the exact candidate
        run: |
          set -euo pipefail
          mkdir -p artifacts/low-quarter-board
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const git = (...args) => execFileSync('git', args, {encoding: 'utf8'}).trim();
          const receipt = {
            head: git('rev-parse', 'HEAD'), tree: git('rev-parse', 'HEAD^{tree}'),
            run_id: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            node: process.version, platform: process.platform,
            scope: 'Real-page desktop/touch board and reload with an explicit completed-save fixture. No playable district mission or physical-phone qualification.'
          };
          fs.writeFileSync('artifacts/low-quarter-board/source.json', JSON.stringify(receipt, null, 2) + '\n');
          JS
          sha256sum campaign_low_quarter.js campaign_low_quarter_runtime.js campaign_story.js campaign_late_game_bootstrap.js chapters_vii_x.js index.html test_campaign_low_quarter.js scripts/low_quarter_browser.mjs scripts/media_http_server.py package-lock.json .github/workflows/low-quarter-board.yml > artifacts/low-quarter-board/source-sha256.txt
      - name: Verify existing rescue authority contracts
        run: |
          set -euo pipefail
          node test_campaign_low_quarter.js 2>&1 | tee artifacts/low-quarter-board/contracts.log
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Exercise the real-page board in desktop and touch layouts
        run: |
          set -euo pipefail
          python3 scripts/media_http_server.py --port 4208 --bind 127.0.0.1 > artifacts/low-quarter-board/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..30}; do
            if curl -fsS "$LOW_QUARTER_BASE_URL" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          timeout 180s node scripts/low_quarter_browser.mjs 2>&1 | tee artifacts/low-quarter-board/browser.log
      - name: Confirm tracked source remained unchanged
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: low-quarter-board-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: artifacts/low-quarter-board/
          if-no-files-found: error
          retention-days: 14
