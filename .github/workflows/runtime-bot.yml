name: Runtime bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "*.html"
      - "*.css"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/runtime-bot.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.js"
      - "*.html"
      - "*.css"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/runtime-bot.yml"
      - ".github/workflows/runtime-fixer.yml"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: runtime-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser bot
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Start exact-commit local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/techops-runtime-server.log 2>&1 &
          echo $! > /tmp/techops-runtime-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/techops-runtime-server.log
          exit 1

      - name: Run Good Boys iPhone intro regression
        id: intro
        continue-on-error: true
        env:
          BOT_BASE_URL: http://127.0.0.1:4173/
          BOT_OUT_DIR: runtime-bot-artifacts
        run: |
          set +e
          timeout 90s node scripts/good_boys_intro_mobile_bot.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Night Crawler + Good Boys REPL bot
        id: bot
        continue-on-error: true
        env:
          BOT_BASE_URL: http://127.0.0.1:4173/
          BOT_OUT_DIR: runtime-bot-artifacts
        run: |
          set +e
          timeout 180s npm run runtime-bot
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Good Boys progression bot
        id: progression
        continue-on-error: true
        env:
          BOT_BASE_URL: http://127.0.0.1:4173/
          BOT_OUT_DIR: runtime-bot-artifacts
        run: |
          set +e
          timeout 180s node scripts/good_boys_progression_bot.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Good Boys background bible bot
        id: backgrounds
        continue-on-error: true
        env:
          BOT_BASE_URL: http://127.0.0.1:4173/
          BOT_OUT_DIR: runtime-bot-artifacts
        run: |
          set +e
          timeout 120s node scripts/good_boys_background_bible_bot.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Add reports to workflow summary
        if: always()
        run: |
          if [ -f runtime-bot-artifacts/goodboys-intro-mobile.md ]; then
            cat runtime-bot-artifacts/goodboys-intro-mobile.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# Good Boys iPhone Intro Bot\n\nReport file was not produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -f runtime-bot-artifacts/report.md ]; then
            cat runtime-bot-artifacts/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# Runtime bot\n\nReport file was not produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -f runtime-bot-artifacts/goodboys-progression.md ]; then
            cat runtime-bot-artifacts/goodboys-progression.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# Good Boys Progression Bot\n\nReport file was not produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -f runtime-bot-artifacts/goodboys-background-bible.md ]; then
            cat runtime-bot-artifacts/goodboys-background-bible.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# Good Boys Background Bible Bot\n\nReport file was not produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload REPL, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-bot-${{ github.sha }}
          path: runtime-bot-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Report failure to GitHub issue
        if: always() && github.event_name != 'pull_request' && (steps.intro.outputs.exit_code != '0' || steps.bot.outputs.exit_code != '0' || steps.progression.outputs.exit_code != '0' || steps.backgrounds.outputs.exit_code != '0')
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Runtime Bot: playable-mode regression"
          issue="$(gh issue list --state open --json number,title --jq '.[] | select(.title=="Runtime Bot: playable-mode regression") | .number' | head -n1)"
          {
            echo
            echo "Commit: \`$SHA\`"
            echo "Run: $RUN_URL"
            echo
            [ -f runtime-bot-artifacts/goodboys-intro-mobile.md ] && cat runtime-bot-artifacts/goodboys-intro-mobile.md || echo "Good Boys iPhone intro report missing."
            echo
            [ -f runtime-bot-artifacts/report.md ] && cat runtime-bot-artifacts/report.md || echo "Runtime mode report missing."
            echo
            [ -f runtime-bot-artifacts/goodboys-progression.md ] && cat runtime-bot-artifacts/goodboys-progression.md || echo "Progression report missing."
            echo
            [ -f runtime-bot-artifacts/goodboys-background-bible.md ] && cat runtime-bot-artifacts/goodboys-background-bible.md || echo "Background bible report missing."
          } > /tmp/runtime-bot-issue.md
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file /tmp/runtime-bot-issue.md
          else
            gh issue create --title "$title" --body-file /tmp/runtime-bot-issue.md
          fi

      - name: Enforce runtime bot result
        if: always()
        run: |
          test "${{ steps.intro.outputs.exit_code }}" = "0"
          test "${{ steps.bot.outputs.exit_code }}" = "0"
          test "${{ steps.progression.outputs.exit_code }}" = "0"
          test "${{ steps.backgrounds.outputs.exit_code }}" = "0"
