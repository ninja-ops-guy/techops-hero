name: Runtime bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "*.html"
      - "*.css"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "test_runtime_triage.mjs"
      - "assets/**/*.mp4"
      - "assets/**/*.png"
      - ".github/workflows/runtime-bot.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.js"
      - "*.html"
      - "*.css"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "test_runtime_triage.mjs"
      - "assets/**/*.png"
      - ".github/workflows/runtime-bot.yml"
      - ".github/workflows/runtime-fixer.yml"
  schedule:
    - cron: "17 */2 * * *"

# Browser/PR jobs have no repository write permissions. Issue posting is isolated.
permissions:
  contents: read

concurrency:
  group: runtime-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triage-contracts:
    name: Runtime triage contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test_runtime_triage.mjs

  media-isolation:
    runs-on: macos-14
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install WebKit diagnostic
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps webkit
      - name: Decode original films without game scripts
        run: |
          python3 scripts/media_http_server.py --port 4173 --bind 127.0.0.1 > /tmp/media-probe-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          python3 -c 'import subprocess; subprocess.run(["node", "scripts/media_decode_probe.mjs"], timeout=45, check=True)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-isolation-${{ github.sha }}
          path: runtime-bot-artifacts/media-isolation.json
          retention-days: 14

  browser-runtime:
    runs-on: macos-14
    timeout-minutes: 18
    env:
      BOT_CHROMIUM_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install portable timeout command
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install browser bot
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
          if [ ! -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then brew install --cask google-chrome; fi
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
      - name: Start exact-commit local server
        run: |
          python3 scripts/test_media_http_server.py
          python3 scripts/media_http_server.py --port 4173 --bind 127.0.0.1 > /tmp/techops-runtime-server.log 2>&1 &
          echo $! > /tmp/techops-runtime-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/techops-runtime-server.log
          exit 1
      - name: Review extracted art in Chrome and WebKit
        id: art
        continue-on-error: true
        run: |
          set +e
          timeout 90s node scripts/art_handoff_bot.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Compare M3, Sector 04 and Night presentation
        id: presentation
        continue-on-error: true
        run: |
          set +e
          timeout 120s node scripts/presentation_slice_bot.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify contextual Night Crawler combat
        id: night_combat
        continue-on-error: true
        run: |
          set +e
          # Match the authoritative Night Combat Integration gate. The bot runs three\n          # browser/touch profiles and can exceed 150s on macOS while remaining healthy.\n          # Exit 124 is still a failure; this only removes the premature budget mismatch.\n          timeout 300s node scripts/night_combat_bot.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify local co-op, solo puzzles and home presentation
        id: coop
        continue-on-error: true
        run: |
          set +e
          timeout 360s node scripts/good_dogs_coop_bot.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run Good Dogs iPhone M1 to M3 regression
        id: intro
        continue-on-error: true
        env:
          BOT_BASE_URL: http://127.0.0.1:4173/
          BOT_OUT_DIR: runtime-bot-artifacts
        run: |
          set +e
          timeout 150s node scripts/good_boys_intro_mobile_bot.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run MORNINGSTAR + swarm iPhone regression
        id: late_game
        continue-on-error: true
        env:
          BOT_BASE_URL: http://127.0.0.1:4173/
          BOT_OUT_DIR: runtime-bot-artifacts
        run: |
          set +e
          timeout 90s node scripts/late_game_mobile_bot.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run Night Crawler + Good Dogs runtime bot
        id: bot
        continue-on-error: true
        env:
          BOT_BASE_URL: http://127.0.0.1:4173/
          BOT_OUT_DIR: runtime-bot-artifacts
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 300s npm run runtime-bot
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run Good Dogs progression bot
        id: progression
        continue-on-error: true
        env:
          BOT_BASE_URL: http://127.0.0.1:4173/
          BOT_OUT_DIR: runtime-bot-artifacts
        run: |
          set +e
          timeout 240s node scripts/good_boys_progression_bot.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run Good Dogs background bible bot
        id: backgrounds
        continue-on-error: true
        env:
          BOT_BASE_URL: http://127.0.0.1:4173/
          BOT_OUT_DIR: runtime-bot-artifacts
        run: |
          set +e
          timeout 180s node scripts/good_boys_background_bible_bot.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Add reports to workflow summary
        if: always()
        run: |
          for report in goodboys-intro-mobile late-game-mobile report goodboys-progression goodboys-background-bible; do
            if [ -f "runtime-bot-artifacts/$report.md" ]; then
              cat "runtime-bot-artifacts/$report.md" >> "$GITHUB_STEP_SUMMARY"
            else
              printf '\nReport missing: %s.md\n' "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
            printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload REPL, screenshots and traces
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-bot-${{ github.sha }}
          path: runtime-bot-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Build agent triage bundle
        id: triage
        if: always()
        env:
          RUNTIME_STEP_RESULTS: ${{ toJSON(steps) }}
          RUNTIME_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          RUNTIME_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          RUNTIME_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: node scripts/runtime_triage.mjs
      - name: Upload compact agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-triage-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-triage/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce runtime bot result
        if: always()
        run: |
          test "${{ steps.night_combat.outputs.exit_code }}" = "0"
          test "${{ steps.coop.outputs.exit_code }}" = "0"
          test "${{ steps.art.outputs.exit_code }}" = "0"
          test "${{ steps.presentation.outputs.exit_code }}" = "0"
          test "${{ steps.intro.outputs.exit_code }}" = "0"
          test "${{ steps.late_game.outputs.exit_code }}" = "0"
          test "${{ steps.bot.outputs.exit_code }}" = "0"
          test "${{ steps.progression.outputs.exit_code }}" = "0"
          test "${{ steps.backgrounds.outputs.exit_code }}" = "0"
          test "${{ steps.triage.outputs.status }}" = "pass"

  pr-triage:
    name: PR agent triage (read-only)
    needs: [browser-runtime, media-isolation]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # No checkout, no code execution from the archive, no comments or repairs.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: runtime-triage-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-triage
      - name: Expose triage in PR checks
        env:
          BROWSER_RESULT: ${{ needs.browser-runtime.result }}
          MEDIA_RESULT: ${{ needs.media-isolation.result }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file = 'runtime-triage/triage.md';
          const header = `# PR evidence handoff\n\nBrowser runtime: ${process.env.BROWSER_RESULT}; media isolation: ${process.env.MEDIA_RESULT}.\n\n`;
          const body = fs.existsSync(file) && fs.statSync(file).isFile() && fs.statSync(file).size <= 60000
            ? fs.readFileSync(file, 'utf8')
            : 'Triage artifact missing or invalid. Inspect the source run logs and artifacts; this is not passing evidence.\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, header + body);
          JS

  report-failure:
    name: Report main runtime failure
    needs: [browser-runtime, media-isolation, triage-contracts]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.browser-runtime.result == 'failure' || needs.media-isolation.result == 'failure' || needs.triage-contracts.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: runtime-issue-report-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # This privileged job never checks out code or executes artifact content.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: runtime-triage-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-triage
      - name: Post idempotent artifact-backed failure report
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_RESULT: ${{ needs.browser-runtime.result }}
          MEDIA_RESULT: ${{ needs.media-isolation.result }}
          CONTRACT_RESULT: ${{ needs.triage-contracts.result }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const {GITHUB_REPOSITORY: repo, GITHUB_RUN_ID: run, GITHUB_RUN_ATTEMPT: attempt, GITHUB_SHA: sha} = process.env;
          const gh = (...args) => execFileSync('gh', args, {encoding: 'utf8', maxBuffer: 8 * 1024 * 1024});
          const title = 'Runtime Bot: playable-mode regression';
          const marker = `<!-- runtime-triage:${run}:${attempt} -->`;
          const url = `https://github.com/${repo}/actions/runs/${run}`;
          const file = 'runtime-triage/triage.md';
          const report = fs.existsSync(file) && fs.statSync(file).isFile() && fs.statSync(file).size <= 60000
            ? fs.readFileSync(file, 'utf8')
            : 'Agent triage evidence is missing or invalid. Consult run logs; do not treat missing reports as passing.\n';
          const body = `${marker}\nCommit: ${sha}\nRun: ${url}\nBrowser: ${process.env.BROWSER_RESULT}; media: ${process.env.MEDIA_RESULT}; triage contracts: ${process.env.CONTRACT_RESULT}.\n\n${report}`;
          const issues = JSON.parse(gh('issue', 'list', '--repo', repo, '--state', 'open', '--search', '"Runtime Bot: playable-mode regression" in:title', '--limit', '100', '--json', 'number,title,body'));
          const issue = issues.find(item => item.title === title);
          if (issue) {
            const comments = gh('api', '--paginate', `repos/${repo}/issues/${issue.number}/comments`, '--jq', '.[].body');
            if ((issue.body || '').includes(marker) || comments.includes(marker)) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'This run attempt was already reported.\n');
              process.exit(0);
            }
          }
          fs.writeFileSync('/tmp/runtime-bot-issue.md', body);
          if (issue) gh('issue', 'comment', String(issue.number), '--repo', repo, '--body-file', '/tmp/runtime-bot-issue.md');
          else gh('issue', 'create', '--repo', repo, '--title', title, '--body-file', '/tmp/runtime-bot-issue.md');
          JS

# validation touch: story bible gaps 4-7 runtime v1
