name: R1 desktop performance evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/performance_profile_browser.mjs'
      - 'test_production_performance_budget.js'
      - 'docs/PERFORMANCE_EVIDENCE_R1.md'
      - '.github/workflows/performance-evidence.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Collect exact-head desktop performance evidence
        env:
          PERF_OUT_DIR: artifacts/r1-performance
          PERF_OPERATOR: github-actions-desktop-profiler
          PERF_DEVICE: ubuntu-latest
        run: node scripts/performance_profile_browser.mjs
      - name: Upload retained performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-desktop-performance-${{ github.sha }}
          path: artifacts/r1-performance/
          if-no-files-found: error
          retention-days: 14
