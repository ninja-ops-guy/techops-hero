name: Apply Good Boys runtime harness patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-good-boys-direct-m2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply runtime harness race patch
        run: python3 .github/apply_good_boys_bot_harness_patch.py

      - name: Validate patched harnesses
        run: |
          node --check scripts/good_boys_intro_mobile_bot.mjs
          node --check scripts/runtime_bot.mjs
          node --check scripts/good_boys_progression_bot.mjs
          node --check scripts/good_boys_background_bible_bot.mjs
          node test_good_boys_intro_repair.js
          node test_static_entrypoint_integrity.js

      - name: Commit harness patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/good_boys_intro_mobile_bot.mjs scripts/runtime_bot.mjs scripts/good_boys_progression_bot.mjs scripts/good_boys_background_bible_bot.mjs
          git diff --cached --check
          git commit -m "Harden Good Boys runtime bot phase transitions"
          git push origin HEAD:main
