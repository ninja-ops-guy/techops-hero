name: Apply Good Boys canonical control ownership fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-good-boys-direct-m2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply canonical control ownership fix
        run: python3 .github/apply_good_boys_control_ownership_fix.py

      - name: Validate patched runtime and contracts
        run: |
          node --check good_boys_progression_authority.js
          node --check good_boys_campaign_director.js
          node --check scripts/good_boys_progression_bot.mjs
          node test_good_boys_intro_repair.js
          node test_static_entrypoint_integrity.js

      - name: Commit production ownership fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add good_boys_progression_authority.js good_boys_campaign_director.js scripts/good_boys_progression_bot.mjs test_good_boys_intro_repair.js
          git diff --cached --check
          git commit -m "Fix Good Boys canonical mobile control ownership"
          git push origin HEAD:main
