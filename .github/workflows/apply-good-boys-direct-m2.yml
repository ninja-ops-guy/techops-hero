name: Apply Good Boys direct M2 core patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-good-boys-direct-m2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply direct M2 ownership patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          core = "v736_hooks.js"
          old_start = '''    function start736() {
      try {
        const ts = document.getElementById("title-screen");
        if ((typeof S === "undefined" || !S) || (ts && !ts.classList.contains("hidden"))) {
          S = newState(); S.diff = 1;
          if (ts) ts.classList.add("hidden");
          const hud = document.getElementById("hud"); if (hud) hud.classList.remove("hidden");
          try { showTouchUI(); } catch (e) { }
          try { updateHUD(); } catch (e) { }
        }
        const mt = meta736(); if (!mt) return;
        if (mt.done) { playCine736("b736m8", null); return; }
        runMission736(mt.m || 1);
      } catch (e) { window.__err736s = String(e && e.stack || e); }
    }
'''
          new_start = '''    function start736(options) {
      options = options || {};
      try {
        const ts = document.getElementById("title-screen");
        if ((typeof S === "undefined" || !S) || (ts && !ts.classList.contains("hidden"))) {
          S = newState(); S.diff = 1;
          if (ts) ts.classList.add("hidden");
          const hud = document.getElementById("hud"); if (hud) hud.classList.remove("hidden");
          try { showTouchUI(); } catch (e) { }
          try { updateHUD(); } catch (e) { }
        }
        const mt = meta736(); if (!mt) return false;
        if (options.mission != null) mt.m = Number(options.mission) || mt.m || 1;
        if (mt.done) { playCine736("b736m8", null); return true; }
        if (options.directGameplay) {
          const mission = mt.m || 1;
          startCombat736(mission);
          let runtimeMission = 0;
          try { runtimeMission = Number(NM && NM._v736 && NM._v736.m || 0); } catch (e) { }
          window.__goodBoysDirectGameplay = { mission, requested: true, mounted: runtimeMission === mission, runtimeMission, source: "v736-core", at: Date.now() };
          return runtimeMission === mission;
        }
        runMission736(mt.m || 1);
        return true;
      } catch (e) { window.__err736s = String(e && e.stack || e); return false; }
    }
'''
          replace_once(core, old_start, new_start)

          authority = Path("good_boys_progression_authority.js")
          a = authority.read_text()
          a = a.replace("/* Good Boys deterministic progression authority v11.", "/* Good Boys deterministic progression authority v12.", 1)
          a = a.replace(" * opening may request directGameplay for M2; the canonical v736.start wrapper then\n * skips its redundant registered briefing through the public v725 engine so the\n * existing startCombat736 callback mounts a fresh runtime synchronously.", " * opening may request directGameplay for M2; v736_hooks.js owns that fast path\n * and mounts startCombat736 directly. Later authored mission cinematics remain\n * asynchronous and are settled by finalizeHandoff when their runtime appears.", 1)
          a = a.replace("var VERSION=11,", "var VERSION=12,", 1)
          old_adapter = '''        if(options.directGameplay){
          try{
            var cine=root.v725,active=!!(cine&&typeof cine.active==="function"&&cine.active());
            if(active&&typeof cine.skip==="function"){
              root.__goodBoysDirectGameplay={mission:expected,requested:true,cinematicActive:true,skipped:true,at:Date.now()};
              cine.skip();
            }else root.__goodBoysDirectGameplay={mission:expected,requested:true,cinematicActive:active,skipped:false,reason:active?"skip-unavailable":"no-registered-cinematic",at:Date.now()};
          }catch(skipError){root.__goodBoysDirectGameplay={mission:expected,requested:true,skipped:false,error:String(skipError&&skipError.stack||skipError),at:Date.now()};}
        }
'''
          if a.count(old_adapter) != 1:
              raise SystemExit(f"good_boys_progression_authority.js: expected one v725 adapter, found {a.count(old_adapter)}")
          a = a.replace(old_adapter, "", 1)
          authority.write_text(a)

          test = Path("test_good_boys_intro_repair.js")
          t = test.read_text()
          t = t.replace('const board = fs.readFileSync("katrin_manchez.atlas.js", "utf8");\nnew Function(source);\nnew Function(progression);\nnew Function(board);', 'const board = fs.readFileSync("katrin_manchez.atlas.js", "utf8");\nconst core = fs.readFileSync("v736_hooks.js", "utf8");\nnew Function(source);\nnew Function(progression);\nnew Function(board);\nnew Function(core);', 1)
          t = t.replace("assert.ok(progression.includes('VERSION=11'), \"progression authority must expose v11 direct-M2 + async-safe handoff semantics\");", "assert.ok(progression.includes('VERSION=12'), \"progression authority must expose v12 core-owned direct-M2 + async-safe handoff semantics\");", 1)
          old = '''assert.ok(progression.includes('directGameplay:!!options.directGameplay'), "directGameplay must be forwarded through the v736 start contract");
assert.ok(progression.includes('if(options.directGameplay)'), "only opted-in starts may take the direct gameplay fast path");
assert.ok(progression.includes('cine.skip()'), "direct M2 gameplay must use the existing cinematic callback to mount combat synchronously");
'''
          new = '''assert.ok(progression.includes('directGameplay:!!options.directGameplay'), "directGameplay must be forwarded through the v736 start contract");
assert.ok(!progression.includes('cine.skip()'), "progression authority must not emulate direct gameplay by skipping the cinematic engine");
assert.ok(core.includes('function start736(options)'), "v736 core must accept explicit start options");
assert.ok(core.includes('if (options.directGameplay)'), "v736 core must own the direct gameplay branch");
assert.ok(core.includes('startCombat736(mission)'), "direct M2 gameplay must mount combat from inside v736 core");
assert.ok(core.includes('source: "v736-core"'), "direct M2 diagnostics must identify the core runtime owner");
'''
          if t.count(old) != 1:
              raise SystemExit("test_good_boys_intro_repair.js: direct gameplay assertion block drifted")
          t = t.replace(old, new, 1)
          test.write_text(t)

          static = Path("test_static_entrypoint_integrity.js")
          s = static.read_text()
          s = s.replace('const progressionSource=fs.readFileSync(path.join(__dirname,"good_boys_progression_authority.js"),"utf8");new Function(progressionSource);', 'const progressionSource=fs.readFileSync(path.join(__dirname,"good_boys_progression_authority.js"),"utf8");new Function(progressionSource);\nconst v736Source=fs.readFileSync(path.join(__dirname,"v736_hooks.js"),"utf8");new Function(v736Source);', 1)
          s = s.replace("assert.ok(progressionSource.includes('VERSION=11'),\"Good Boys progression must expose v11 direct-M2 plus async-safe state authority\");", "assert.ok(progressionSource.includes('VERSION=12'),\"Good Boys progression must expose v12 core-owned direct-M2 plus async-safe state authority\");", 1)
          old = '''assert.ok(progressionSource.includes('directGameplay:!!options.directGameplay'),"directGameplay must be forwarded only when explicitly requested");
assert.ok(progressionSource.includes('if(options.directGameplay)'),"canonical v736 wrapper must expose the direct gameplay fast path");
assert.ok(progressionSource.includes('cine.skip()'),"direct gameplay must use the existing registered-cinematic callback to mount combat");
'''
          new = '''assert.ok(progressionSource.includes('directGameplay:!!options.directGameplay'),"directGameplay must be forwarded only when explicitly requested");
assert.ok(!progressionSource.includes('cine.skip()'),"progression authority must not skip the cinematic engine to synthesize direct gameplay");
assert.ok(v736Source.includes('function start736(options)'),"v736 core start must accept handoff options");
assert.ok(v736Source.includes('if (options.directGameplay)'),"v736 core must own the direct gameplay branch");
assert.ok(v736Source.includes('startCombat736(mission)'),"direct M2 must synchronously mount combat inside v736 core");
assert.ok(v736Source.includes('source: "v736-core"'),"v736 direct M2 diagnostics must identify the core owner");
'''
          if s.count(old) != 1:
              raise SystemExit("test_static_entrypoint_integrity.js: direct gameplay assertion block drifted")
          s = s.replace(old, new, 1)
          static.write_text(s)

          print("Good Boys direct M2 core patch applied")
          PY

      - name: Validate patched contracts
        run: |
          node --check v736_hooks.js
          node --check good_boys_progression_authority.js
          node --check scripts/good_boys_progression_bot.mjs
          node --check scripts/good_boys_intro_mobile_bot.mjs
          node test_good_boys_intro_repair.js
          node test_static_entrypoint_integrity.js

      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v736_hooks.js good_boys_progression_authority.js test_good_boys_intro_repair.js test_static_entrypoint_integrity.js
          git diff --cached --check
          git commit -m "Mount Good Boys M2 directly in v736 core"
          git push origin HEAD:main
