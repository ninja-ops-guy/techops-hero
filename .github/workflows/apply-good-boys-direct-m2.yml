name: Apply Good Boys persistence certification fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-good-boys-direct-m2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply persistence and certification fix
        run: python3 .github/apply_good_boys_persistence_cert_fix.py

      - name: Validate patched runtime and contracts
        run: |
          node --check dogs.js
          node --check good_boys_intro_repair.js
          node --check scripts/good_boys_progression_bot.mjs
          node --check scripts/good_boys_background_bible_bot.mjs
          node test_good_boys_intro_repair.js
          node test_mobile_production_tester.js
          node test_static_entrypoint_integrity.js

      - name: Commit persistence and certification fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dogs.js good_boys_intro_repair.js scripts/good_boys_progression_bot.mjs scripts/good_boys_background_bible_bot.mjs test_good_boys_intro_repair.js test_mobile_production_tester.js
          git diff --cached --check
          git commit -m "Persist Good Boys M2 and align certification ownership"
          git push origin HEAD:main
