name: Gameplay continuation source review
on:
  push:
    branches: [feat/gameplay-feedback-workday-pass]
    paths: [.github/workflows/gameplay-continuation-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive exact tracked source without Git credentials
        run: |
          git rev-parse HEAD > /tmp/gameplay-source-sha.txt
          git archive --format=tar HEAD > /tmp/gameplay-source.tar
          sha256sum /tmp/gameplay-source.tar > /tmp/gameplay-source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gameplay-continuation-source
          path: |
            /tmp/gameplay-source.tar
            /tmp/gameplay-source-sha.txt
            /tmp/gameplay-source-sha256.txt
          retention-days: 1
