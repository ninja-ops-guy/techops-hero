name: Apply Night Touch Follow Fix

on:
  push:
    branches:
      - fix/night-touch-follow-refresh

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/night-touch-follow-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply evidence-backed follow refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path

          combat = Path('night_combat.js')
          text = combat.read_text()
          old = """      if(!n.onGround&&!ec.locked){n.vy=-5.8;n.vx=a.face*1.5;c.follow={enemy:e,engaged:true};}\n"""
          new = """      if(!ec.locked){\n        c.follow={enemy:e,engaged:true};\n        if(!n.onGround){n.vy=-5.8;n.vx=a.face*1.5;}\n      }\n"""
          if old not in text:
              raise SystemExit('night_combat.js target snippet not found')
          combat.write_text(text.replace(old, new, 1))

          test = Path('test_night_follow_window.js')
          text = test.read_text()
          old = """test('engaged follow keeps a transient grounded third punch classified as air and consumes on contact',()=>{\n  const f=fixture();engageLauncherFollow(f);\n  f.n.onGround=true;f.n.y=396;f.e.y=286;f.e.x=150;\n  const hp=f.e.hp;\n  assert.equal(f.api.attack(f.n,{},'punch'),true);\n  assert.equal(f.n._nightCombat.attack.kind,'air');\n  advance(f,80);\n  assert.ok(f.e.hp<hp);\n  assert.equal(f.n._nightCombat.follow,null);\n  assert.ok(f.n._nightCombat.events.some(e=>e.type==='air'));\n  assert.equal(f.n._nightCombat.events.some(e=>e.type==='jab'&&e.damage),false);\n});\n"""
          new = """test('engaged follow keeps transient-grounded juggle contacts owned until landing or lock',()=>{\n  const f=fixture();engageLauncherFollow(f);\n  f.n.onGround=true;f.n.y=396;f.e.y=286;f.e.x=150;\n  const hp=f.e.hp;\n  assert.equal(f.api.attack(f.n,{},'punch'),true);\n  assert.equal(f.n._nightCombat.attack.kind,'air');\n  advance(f,80);\n  assert.ok(f.e.hp<hp);\n  assert.equal(f.n._nightCombat.follow.enemy,f.e);\n  assert.equal(f.n._nightCombat.follow.engaged,true);\n  assert.ok(f.n._nightCombat.events.some(e=>e.type==='air'));\n  assert.equal(f.n._nightCombat.events.some(e=>e.type==='jab'&&e.damage),false);\n  advance(f,160);\n  assert.equal(f.api.attack(f.n,{},'punch'),true);\n  assert.equal(f.n._nightCombat.attack.kind,'air');\n});\n"""
          if old not in text:
              raise SystemExit('test_night_follow_window.js target block not found')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Run focused regression
        run: node test_night_follow_window.js
      - name: Remove bootstrap workflow and commit
        run: |
          rm .github/workflows/apply-night-touch-follow-fix.yml
          git config user.name 'TechOps Runtime Bot Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add night_combat.js test_night_follow_window.js .github/workflows/apply-night-touch-follow-fix.yml
          git commit -m 'Fix grounded Night juggle follow ownership'
          git push origin HEAD:fix/night-touch-follow-refresh
