name: Bump Good Boys direct intro v5 cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bump-good-boys-direct-v5-cache.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump direct-intro cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='good_boys_intro_repair.js?v=20260901-goodboys-intro-v4'
          new='good_boys_intro_repair.js?v=20260901-goodboys-direct-intro-v5'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Good Boys intro cache-key anchor missing')
          p.write_text(s)
          PY
          node test_good_boys_intro_repair.js
          node test_static_entrypoint_integrity.js
      - name: Commit cache key
        run: |
          rm .github/workflows/bump-good-boys-direct-v5-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/bump-good-boys-direct-v5-cache.yml
          git commit -m 'Serve Good Boys direct intro v5 to Safari'
          git push origin HEAD:main
