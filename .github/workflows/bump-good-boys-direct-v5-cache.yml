name: Bump Good Boys direct intro v5 cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bump-good-boys-direct-v5-cache.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update direct-intro contract and cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('test_static_entrypoint_integrity.js')
          q=t.read_text()
          start=q.index("assert.ok(introSource.includes('dataset.gbdBypass=\"1\"')")
          end=q.index("\n\nconst bridgeSource",start)
          lines=[
            "assert.ok(introSource.includes('dataset.gbdBypass=\"1\"'), \"direct intro must bypass the legacy director start interceptor\");",
            "assert.ok(introSource.includes('GoodDogsCutscenes.play(\"GD_CUT_01\")'), \"Good Boys must open with the exact source-master GD_CUT_01 cinematic\");",
            "assert.ok(!introSource.includes('SCENES=['), \"retired four-card preamble must not return\");",
            "assert.ok(introSource.includes('e.stopImmediatePropagation()'), \"direct intro launch must isolate the title click from legacy delegated listeners\");",
            "assert.ok(introSource.includes('start.click()'), \"direct intro must use canonical CLOCK IN state initialization after the movie\");",
            "assert.ok(introSource.includes('root.v736.start()'), \"direct intro must hand off into the canonical Good Boys campaign\");",
            "assert.ok(introSource.includes('function verify(attempt)'), \"direct intro must verify campaign attachment after the movie\");",
            "assert.ok(introSource.includes('attempt<2'), \"direct intro attachment retry must remain bounded\");"
          ]
          t.write_text(q[:start]+"\n".join(lines)+q[end:])
          p=Path('index.html')
          s=p.read_text()
          oldkey='good_boys_intro_repair.js?v=20260901-goodboys-intro-v4'
          newkey='good_boys_intro_repair.js?v=20260901-goodboys-direct-intro-v5'
          if oldkey in s:
              s=s.replace(oldkey,newkey,1)
          elif newkey not in s:
              raise SystemExit('Good Boys intro cache-key anchor missing')
          p.write_text(s)
          PY
          node test_good_boys_intro_repair.js
          node test_static_entrypoint_integrity.js
      - name: Commit direct intro contract
        run: |
          rm .github/workflows/bump-good-boys-direct-v5-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html test_static_entrypoint_integrity.js .github/workflows/bump-good-boys-direct-v5-cache.yml
          git commit -m 'Align production contract with direct Good Dogs opening'
          git push origin HEAD:main
