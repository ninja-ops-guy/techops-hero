name: Campaign contracts

on:
  pull_request:
    paths:
      - "campaign_*.js"
      - "test_campaign_*.js"
      - ".github/workflows/campaign-contracts.yml"
  push:
    branches: [main]
    paths:
      - "campaign_*.js"
      - "test_campaign_*.js"
      - ".github/workflows/campaign-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate syntax
        run: |
          node --check campaign_act1.js
          node --check campaign_story.js
      - name: Verify Act I contract
        run: node test_campaign_act1.js
      - name: Verify full campaign contract
        run: node test_campaign_story.js
