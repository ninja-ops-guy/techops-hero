name: Campaign contracts

on:
  pull_request:
    paths:
      - "assets/campaign/**"
      - "assets/v736/**"
      - "campaign_*.js"
      - "good_boys_*.js"
      - "good_dogs_*.js"
      - "production_*.js"
      - "bg_noc.js"
      - "orbital_tiles.source.js"
      - "orbital_tiles.atlas.js"
      - "shuttle.atlas.js"
      - "parts/shuttle_q001.js"
      - "mike_animation_manifest.js"
      - "mike_actions.js"
      - "mike_actions.atlas.js"
      - "index.html"
      - "style.css"
      - "katrin_manchez.atlas.js"
      - "v736_hooks.js"
      - "v737_hooks.js"
      - "scripts/**"
      - "test_campaign_*.js"
      - "test_good_boys_*.js"
      - "test_production_*.js"
      - "test_mobile_production_tester.js"
      - "test_mike_animation_manifest.js"
      - "test_v736_runtime_assets.js"
      - "test_night_runtime_assets.js"
      - "ui_coop.js"
      - "test_ui_coop_contract.js"
      - ".github/workflows/campaign-contracts.yml"
  push:
    branches: [main]
    paths:
      - "assets/campaign/**"
      - "assets/v736/**"
      - "campaign_*.js"
      - "good_boys_*.js"
      - "good_dogs_*.js"
      - "production_*.js"
      - "bg_noc.js"
      - "orbital_tiles.source.js"
      - "orbital_tiles.atlas.js"
      - "shuttle.atlas.js"
      - "parts/shuttle_q001.js"
      - "mike_animation_manifest.js"
      - "mike_actions.js"
      - "mike_actions.atlas.js"
      - "index.html"
      - "style.css"
      - "katrin_manchez.atlas.js"
      - "v736_hooks.js"
      - "v737_hooks.js"
      - "scripts/**"
      - "test_campaign_*.js"
      - "test_good_boys_*.js"
      - "test_production_*.js"
      - "test_mobile_production_tester.js"
      - "test_mike_animation_manifest.js"
      - "test_v736_runtime_assets.js"
      - "test_night_runtime_assets.js"
      - "ui_coop.js"
      - "test_ui_coop_contract.js"
      - ".github/workflows/campaign-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate syntax
        run: |
          node --check campaign_act1.js
          node --check campaign_act2.js
          node --check campaign_assets.js
          node --check campaign_asset_pipeline.js
          node --check campaign_story.js
          node --check campaign_scene_schema.js
          node --check campaign_runtime.js
          node --check campaign_native_act1.js
          node --check campaign_native_act1_visuals.js
          node --check campaign_native_act2.js
          node --check campaign_visual_direction.js
          node --check campaign_world_visuals.js
          node --check good_boys_canon_runtime.js
          node --check good_boys_campaign_assets.js
          node --check good_boys_campaign_director.js
          node --check good_boys_prison_cinematic_patch.js
          node --check good_boys_prison_gameplay_v2.js
          node --check good_boys_background_authority.js
          node --check good_boys_bible_world.js
          node --check good_boys_access_core_authority.js
          node --check good_boys_earthfall_ending.js
          node --check good_boys_progression_authority.js
          node --check good_boys_reference_mechanics.js
          node --check good_boys_gameplay_loop.js
          node --check good_boys_mobile_launch_guard.js
          node --check good_dogs_production_runtime.js
          node --check good_dogs_cutscenes_v2_2.js
          node --check good_dogs_cutscene_bridge.js
          node --check production_asset_registry.js
          node --check production_wrapper_guard.js
          node --check production_runtime_lock.js
          node --check bg_noc.js
          node --check orbital_tiles.source.js
          node --check orbital_tiles.atlas.js
          node --check shuttle.atlas.js
          node --check parts/shuttle_q001.js
          node --check mike_animation_manifest.js
          node --check mike_actions.js
          node --check mike_actions.atlas.js
          node --check campaign_sector04.js
          node --check campaign_sector04_runtime.js
          node --check v736_hooks.js
          node --check v737_hooks.js
          node --check scripts/production_release_gate.js
          node --check scripts/runtime_bot.mjs
          node --check scripts/good_boys_progression_bot.mjs
          node --check scripts/good_boys_background_bible_bot.mjs
          node --check test_campaign_act2.js
          node --check test_campaign_act2_reload_gates.js
          node --check test_campaign_native_act1.js
          node --check test_campaign_native_act1_visuals.js
          node --check test_campaign_native_act2.js
          node --check test_campaign_world_visuals.js
          node --check test_good_boys_canon_runtime.js
          node --check test_good_boys_ui_ownership.js
          node --check test_good_boys_mobile_launch_guard.js
          node --check test_good_boys_ship_deck_mapping.js
          node --check test_production_asset_registry.js
          node --check test_production_compositor.js
          node --check test_production_runtime_lock.js
          node --check test_mobile_production_tester.js
          node --check test_mike_animation_manifest.js
          node --check test_campaign_day1_runtime_gate.js
          node --check test_campaign_opening_acceptance.js
          node --check test_campaign_scene_schema.js
          node --check test_campaign_assets.js
          node --check test_campaign_asset_pipeline.js
          node --check test_campaign_runtime_assets.js
          node --check test_campaign_sector04.js
          node --check test_campaign_sector04_runtime.js
          node --check test_campaign_save_reload.js
          node --check test_campaign_browser_entrypoint.js
          node --check test_static_entrypoint_integrity.js
          node --check test_v736_runtime_assets.js
          node --check test_night_runtime_assets.js
          node --check test_ui_coop_contract.js
      - name: Verify Act I contract
        run: node test_campaign_act1.js
      - name: Verify Acts II-III semantic proof
        run: node test_campaign_act2.js
      - name: Verify Acts II-III reload continuity
        run: node test_campaign_act2_reload_gates.js
      - name: Verify native Acts II-III gameplay
        run: node test_campaign_native_act2.js
      - name: Verify Day 1 reference presentation
        run: node test_campaign_native_act1_visuals.js
      - name: Verify playable world presentation
        run: node test_campaign_world_visuals.js
      - name: Verify Good Boys canon runtime
        run: node test_good_boys_canon_runtime.js
      - name: Verify Good Boys UI ownership
        run: node test_good_boys_ui_ownership.js
      - name: Verify Good Boys mobile launch recovery
        run: node test_good_boys_mobile_launch_guard.js
      - name: Verify production asset inventory
        run: node test_production_asset_registry.js
      - name: Verify single Night compositor
        run: node test_production_compositor.js
      - name: Verify production runtime lock
        run: node test_production_runtime_lock.js
      - name: Verify production mobile tester
        run: node test_mobile_production_tester.js
      - name: Verify Mike animation semantics
        run: node test_mike_animation_manifest.js
      - name: Verify Mike action atlas remains quarantined
        run: |
          node - <<'NODE'
          global.window = global;
          require('./mike_actions.atlas.js');
          require('./mike_actions.js');
          const manifest = require('./mike_animation_manifest.js');
          if (!global.MIKE_ACTIONS || Object.keys(global.MIKE_ACTIONS.frames || {}).length !== 182) throw new Error('MIKE_ACTIONS metadata contract changed');
          if (global.MIKE_ACTIONS.src) throw new Error('MIKE_ACTIONS gained a source: classify/approve its semantics before enabling it');
          if (global.TO_MIKE_ACTIONS || global.__GK_MIKE_ACTIONS) throw new Error('Mike action payload restored: visually review and classify f000-f181 before enabling it');
          if (manifest.actionAtlasReady(global)) throw new Error('Unclassified Mike action atlas must not be render-ready');
          if (Object.keys(manifest.ACTION_ATLAS.approvedStates).length) throw new Error('Unreviewed Mike action frames must remain quarantined');
          console.log('Mike action atlas quarantine: PASS');
          NODE
      - name: Verify campaign visual atlas integration
        run: node test_campaign_visual_assets.js
      - name: Verify campaign asset contract
        run: node test_campaign_assets.js
      - name: Verify campaign asset pipeline
        run: node test_campaign_asset_pipeline.js
      - name: Verify campaign runtime assets
        run: node test_campaign_runtime_assets.js
      - name: Verify full campaign contract
        run: node test_campaign_story.js
      - name: Verify campaign scene schema
        run: node test_campaign_scene_schema.js
      - name: Verify campaign runtime adapter
        run: node test_campaign_runtime.js
      - name: Verify native Act I integration
        run: node test_campaign_native_act1.js
      - name: Verify Day 1 runtime gate
        run: node test_campaign_day1_runtime_gate.js
      - name: Verify production opening acceptance
        run: node test_campaign_opening_acceptance.js
      - name: Verify Sector 04 native sandbox
        run: node test_campaign_sector04.js
      - name: Verify Sector 04 runtime bridge
        run: node test_campaign_sector04_runtime.js
      - name: Verify Act I save/reload traversal
        run: node test_campaign_save_reload.js
      - name: Verify campaign browser entrypoint
        run: node test_campaign_browser_entrypoint.js
      - name: Verify static entrypoint integrity
        run: node test_static_entrypoint_integrity.js
      - name: Verify Good Dogs runtime assets
        run: node test_v736_runtime_assets.js
      - name: Verify Night runtime assets
        run: node test_night_runtime_assets.js
      - name: Verify UI co-op asset authority
        run: node test_ui_coop_contract.js
      - name: Verify aggregate production release gate
        run: node scripts/production_release_gate.js
