name: Gameplay quality validation
on:
  pull_request:
    branches: [main]
    paths:
      - '**.js'
      - 'scripts/**'
      - '*.html'
      - '*.css'
      - 'package*.json'
      - '.github/workflows/gameplay-review-bundle.yml'
permissions:
  contents: read
concurrency:
  group: gameplay-quality-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate checked-out production sources
        run: |
          set -euo pipefail
          mkdir -p runtime-bot-artifacts
          git rev-parse HEAD > runtime-bot-artifacts/tested-commit.txt
          node scripts/production_release_gate.js | tee runtime-bot-artifacts/gameplay-production-gate.log
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Check gameplay in Chromium and WebKit
        env:
          BOT_BASE_URL: http://127.0.0.1:4173/
          BOT_OUT_DIR: runtime-bot-artifacts
        run: |
          set -euo pipefail
          python3 scripts/media_http_server.py --port 4173 --bind 127.0.0.1 > runtime-bot-artifacts/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..30}; do
            if curl -fsS "$BOT_BASE_URL" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          timeout 480s node scripts/gameplay_quality_bot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-quality-${{ github.sha }}
          path: runtime-bot-artifacts/
          retention-days: 7
