name: Gameplay review workspace
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gameplay-review-bundle.yml'
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Exact tracked-source reproduction bundle
        run: |
          mkdir -p /tmp/gameplay-review
          git rev-parse HEAD > /tmp/gameplay-review/HEAD.txt
          git archive --format=tar HEAD | gzip -1 > /tmp/gameplay-review/source.tar.gz
          sha256sum /tmp/gameplay-review/source.tar.gz > /tmp/gameplay-review/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gameplay-review-source
          path: /tmp/gameplay-review/
          retention-days: 2
          compression-level: 0
      - name: Baseline production regression gate
        run: node scripts/production_release_gate.js
