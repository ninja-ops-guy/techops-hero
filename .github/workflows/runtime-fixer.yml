name: Runtime Fixer

on:
  workflow_run:
    workflows: ["Runtime bot"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed Runtime bot run ID to repair"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: runtime-fixer-main
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.name == 'Runtime bot' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      FAILED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
      RUNTIME_ARTIFACT_DIR: runtime-fixer-input
      RUNTIME_AUTOFIX_SUMMARY: /tmp/runtime-autofix-summary.md
      RUNTIME_AUTOFIX_RESULT: /tmp/runtime-autofix-result.json

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - name: Resolve failed run metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          data="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          name="$(jq -r '.name' <<<"$data")"
          conclusion="$(jq -r '.conclusion // ""' <<<"$data")"
          sha="$(jq -r '.head_sha' <<<"$data")"
          url="$(jq -r '.html_url' <<<"$data")"
          if [ "$name" != "Runtime bot" ]; then
            echo "Refusing non-Runtime-bot run: $name" >&2
            exit 1
          fi
          branch="$(jq -r '.head_branch' <<<"$data")"
          event="$(jq -r '.event' <<<"$data")"
          repository="$(jq -r '.head_repository.full_name' <<<"$data")"
          if [ "$branch" != main ] || [ "$repository" != "$GITHUB_REPOSITORY" ]; then
            echo "Refusing evidence outside this repository's main branch." >&2
            exit 1
          fi
          case "$event" in
            push|schedule|workflow_dispatch) ;;
            *) echo "Refusing unsupported source event: $event" >&2; exit 1 ;;
          esac
          case "$conclusion" in
            failure)
              if [ "$sha" = "$(git rev-parse HEAD)" ]; then
                echo "skip=false" >> "$GITHUB_OUTPUT"
              else
                echo "Stale evidence for $sha; current main requires a fresh Runtime bot run."
                echo "skip=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "Run conclusion is $conclusion; nothing actionable to repair."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download Runtime bot evidence
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNTIME_ARTIFACT_DIR"
          artifact="runtime-bot-${{ steps.meta.outputs.sha }}"
          if ! gh run download "$RUN_ID" --name "$artifact" --dir "$RUNTIME_ARTIFACT_DIR"; then
            echo "Artifact $artifact was unavailable; fixer will run in evidence-missing mode." >&2
          fi
          find "$RUNTIME_ARTIFACT_DIR" -maxdepth 2 -type f -print || true

      - name: Ensure media repair tooling
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Apply known-safe runtime repairs
        if: steps.meta.outputs.skip != 'true'
        env:
          RUNTIME_FAILED_SHA: ${{ steps.meta.outputs.sha }}
          RUNTIME_RUN_ID: ${{ env.RUN_ID }}
        run: node scripts/runtime_autofix.mjs

      - name: Add fixer summary
        if: always() && steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          if [ -f "$RUNTIME_AUTOFIX_SUMMARY" ]; then
            cat "$RUNTIME_AUTOFIX_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# Runtime Autofix' >> "$GITHUB_STEP_SUMMARY"
            echo 'Fixer did not produce a summary.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for repair
        if: steps.meta.outputs.skip != 'true'
        id: diff
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
            git diff --check
          fi

      - name: Static and targeted repair gates
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/runtime_autofix.mjs
          node test_runtime_autofix.mjs
          while IFS= read -r f; do
            [ -n "$f" ] && node --check "$f"
          done < <(git diff --name-only -- '*.js' '*.mjs')
          if git diff --name-only | grep -qx 'scripts/late_game_mobile_bot.mjs'; then
            node test_campaign_late_game_contracts.js
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$f")"
            pix="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$f")"
            test "$codec" = "h264"
            test "$pix" = "yuv420p"
          done < <(git diff --name-only -- '*.mp4')

      - name: Preserve reviewable repair evidence
        if: always() && steps.meta.outputs.skip == 'false'
        shell: bash
        run: |
          mkdir -p /tmp/runtime-fixer-review
          git diff --binary > /tmp/runtime-fixer-review/repair.patch
          for file in "$RUNTIME_AUTOFIX_RESULT" "$RUNTIME_AUTOFIX_SUMMARY"; do
            if [ -f "$file" ]; then cp "$file" /tmp/runtime-fixer-review/; fi
          done
          git rev-parse HEAD > /tmp/runtime-fixer-review/base-sha.txt

      - name: Upload repair evidence
        if: always() && steps.meta.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-fixer-review-${{ github.run_id }}
          path: /tmp/runtime-fixer-review/
          retention-days: 14

      - name: Create repair branch and PR
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch="runtime-fix/sha-${{ steps.meta.outputs.sha }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "A repair branch already exists for this SHA: $branch. Review it before generating another repair." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "runtime-fixer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -u
          git commit -m "Autofix Runtime bot failure #${RUN_ID}"
          git push origin "$branch"

          cat > /tmp/runtime-fixer-pr.md <<EOF
          Automated repair for failed Runtime bot run ${RUN_ID}.

          Failed run: ${{ steps.meta.outputs.url }}
          Failed commit: \`${{ steps.meta.outputs.sha }}\`

          The fixer only applies repository-defined, known-safe transformations. This PR is intentionally not auto-merged; CI must validate the repair first.

          $(cat "$RUNTIME_AUTOFIX_SUMMARY")
          EOF

          if ! gh pr create \
            --base main \
            --head "$branch" \
            --title "Runtime Fixer: repair run ${RUN_ID}" \
            --body-file /tmp/runtime-fixer-pr.md 2>/tmp/runtime-fixer-pr-error.txt; then
            cat /tmp/runtime-fixer-pr-error.txt >&2
            echo "PR creation failed; repair remains on $branch and in the workflow artifact. No merge was performed." >> "$GITHUB_STEP_SUMMARY"
            echo "If GitHub reports that Actions may not create PRs, the repository owner must enable that setting or review the branch manually." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Record no-safe-fix outcome
        if: steps.meta.outputs.skip != 'true' && steps.diff.outputs.changed != 'true'
        shell: bash
        run: |
          echo "No repository-defined safe mutation was available for Runtime bot run ${RUN_ID}." >> "$GITHUB_STEP_SUMMARY"
          echo "The Runtime bot issue/report remains the escalation path for this finding." >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNTIME_AUTOFIX_SUMMARY" ]; then
            cat "$RUNTIME_AUTOFIX_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi
