name: Install Good Boys intro repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-good-boys-intro-repair.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire repaired intro into production entrypoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          needle='<script src="good_boys_campaign_director.js?v=20260829-goodboys-art-ui-v3"></script><script src="good_dogs_cutscenes_v2_2.js?v=20260831-gooddogs-master-v1"></script>'
          replacement='<script src="good_boys_campaign_director.js?v=20260829-goodboys-art-ui-v3"></script><script src="good_boys_intro_repair.js?v=20260831-goodboys-intro-v1"></script><script src="good_dogs_cutscenes_v2_2.js?v=20260831-gooddogs-master-v1"></script>'
          if needle not in s:
              raise SystemExit('expected Good Boys director/cutscene entrypoint sequence not found')
          s=s.replace(needle,replacement,1)
          p.write_text(s)
          PY
          node test_static_entrypoint_integrity.js
          node --check good_boys_intro_repair.js
      - name: Commit production wiring and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/install-good-boys-intro-repair.yml
          git commit -m "Wire repaired Good Boys mobile intro"
          git push
