name: Integrate PR29
on:
  push:
    branches: [integrate/pr29-on-main-20260912]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Merge reviewed PR29 combat changes onto current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main fix/night-directional-combat-integration
          git merge --no-ff -X ours origin/fix/night-directional-combat-integration -m "Integrate PR #29 directional combat onto current main"
      - name: Reconcile directional combat with current production contracts
        run: |
          set -euo pipefail
          git checkout origin/fix/night-directional-combat-integration -- night_combat.js night_combat_input.js v55_hooks.js v730_hooks.js
          git checkout origin/main -- index.html test_static_entrypoint_integrity.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          CACHE='20260912-directional-integrated-r2'

          p=Path('night_combat.js'); s=p.read_text()
          s=s.replace("function sound(id){try{if(typeof root.sfx==='function')root.sfx(id);}",
                      "function sound(id){try{if(!root.TechOpsCombatAudio&&typeof root.sfx==='function')root.sfx(id);}",1)
          old="function event(n,type,e,extra){const c=state(n),r=Object.assign({id:++c.serial,type,time:c.time,x:e?e.x+e.w/2:n.x+n.w/2,y:e?e.y+e.h/2:n.y},extra||{});c.events.push(r);if(c.events.length>32)c.events.shift();c.fx.push(r);if(c.fx.length>24)c.fx.shift();root.__nightCombatEvent=r;return r;}"
          new="function event(n,type,e,extra){const c=state(n),r=Object.assign({id:++c.serial,type,time:c.time,x:e?e.x+e.w/2:n.x+n.w/2,y:e?e.y+e.h/2:n.y},extra||{});c.events.push(r);if(c.events.length>32)c.events.shift();c.fx.push(r);if(c.fx.length>24)c.fx.shift();root.__nightCombatEvent=r;try{if(root.TechOpsCombatAudio){const map={uppercut:'launcher',low:'jab',kick:'launcher','rising-kick':'launcher',sweep:'cross','air-kick':'air','air-slam':'slam','grab-miss':'whiff'};root.TechOpsCombatAudio.emit(n,map[type]?Object.assign({},r,{type:map[type]}):r);}}catch(_){}return r;}"
          if old not in s: raise SystemExit('PR29 event contract not found')
          s=s.replace(old,new,1)
          s=s.replace("function damage(n,e,value,kind){", "function damage(n,e,value,kind,flags){",1)
          s=s.replace("event(n,kind,e,{damage:Math.round(value)});", "event(n,kind,e,Object.assign({damage:Math.round(value)},flags||{}));",1)
          s=s.replace("a.connected=damage(n,e,value,a.kind)&&!shield;", "a.connected=damage(n,e,value,a.kind,{guarded:!!shield})&&!shield;",1)
          # PR29 uses blocked() for input gating while current main exposes blocked(n,e) as a semantic block event.
          # Keep both contracts by renaming the predicate and restoring the event method.
          s=s.replace("function blocked(){const s=typeof S!=='undefined'?S:root.S;", "function inputBlocked(){const s=typeof S!=='undefined'?S:root.S;",1)
          s=s.replace("if(!active(n)||blocked()||!['legacy','punch','kick','grab'].includes(action))", "if(!active(n)||inputBlocked()||!['legacy','punch','kick','grab'].includes(action))",1)
          s=s.replace("if(!active(n))return {locked:false};if(n.drive||blocked())return {locked:true};", "if(!active(n))return {locked:false};if(n.drive||inputBlocked())return {locked:true};",1)
          marker="  function hurt(n){if(!active(n))return;cancel(n);const c=state(n);c.stunUntil=c.time+180;event(n,'hurt');}"
          if marker not in s: raise SystemExit('hurt contract missing')
          s=s.replace(marker,"  function blockedContact(n,e){if(active(n))event(n,'block',e);}\n"+marker,1)
          old_export="root.TechOpsNightCombat={VERSION:2,RULES,MOVES,active,state,attack,tick,stepEnemy,hurt,cancel,pose,draw,target,normalizeInput,readInput,jumpCancel,grab:(n,k)=>attack(n,k,'grab'),kick:(n,k)=>attack(n,k,'kick')};"
          new_export="root.TechOpsNightCombat={VERSION:2,RULES,MOVES,active,state,attack,tick,stepEnemy,blocked:blockedContact,hurt,cancel,pose,draw,target,normalizeInput,readInput,jumpCancel,grab:(n,k)=>attack(n,k,'grab'),kick:(n,k)=>attack(n,k,'kick')};"
          if old_export not in s: raise SystemExit('combat export contract missing')
          s=s.replace(old_export,new_export,1)
          p.write_text(s)

          p=Path('production_bootstrap.js'); s=p.read_text()
          if '"night_combat_input.js"' not in s:
              anchor='"night_combat.js",'
              if anchor not in s: raise SystemExit('night combat bootstrap anchor missing')
              s=s.replace(anchor,anchor+'\n    "night_combat_input.js",',1)
          if s.count('"night_combat_input.js"') != 1: raise SystemExit('night combat input duplicated')
          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          for src in ('night_hooks.js','v55_hooks.js','v730_hooks.js'):
              pattern=r'src="'+re.escape(src)+r'(?:\?v=[^"]*)?"'
              s,n=re.subn(pattern,'src="'+src+'?v='+CACHE+'"',s,count=1)
              if n != 1: raise SystemExit(f'entrypoint missing: {src}')
          p.write_text(s)

          p=Path('test_static_entrypoint_integrity.js'); s=p.read_text()
          # Remove the two changed hooks from the old shared-cache assertion, then assert their new cache explicitly.
          s=s.replace('"game.js", "night_hooks.js", "v55_hooks.js", "v57_hooks.js"', '"game.js", "v57_hooks.js"',1)
          anchor='for(const src of ["game.js", "v57_hooks.js", "v64_hooks.js", "v69_hooks.js", "v70_hooks.js", "v710_hooks.js", "v716_hooks.js", "v733_hooks.js", "v735_hooks.js", "bg_noc.js", "campaign_sector04_runtime.js", "campaign_native_act2.js", "good_boys_canon_runtime.js"]) assert.strictEqual(refFor(src),src+"?v=20260912-night-reviewed-r1");'
          if anchor not in s: raise SystemExit('current-main cache assertion changed')
          s=s.replace(anchor,anchor+'\nfor(const src of ["night_hooks.js","v55_hooks.js","v730_hooks.js"]) assert.strictEqual(refFor(src),src+"?v='+CACHE+'");',1)
          p.write_text(s)

          p=Path('scripts/production_release_gate.js'); s=p.read_text()
          anchor='  "test_night_combat.js",\n'
          for f in ('test_night_directional_combat.js','test_night_directional_physics.js','test_night_directional_integration.js'):
              if f not in s:
                  s=s.replace(anchor,anchor+f'  "{f}",\n',1)
          p.write_text(s)
          PY
      - name: Validate integrated combat and production contracts
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --check night_combat.js
          node --check night_combat_input.js
          node scripts/production_release_gate.js
          node test_night_directional_combat.js
          node test_night_directional_physics.js
          node test_night_directional_integration.js
          node test_runtime_combat_audio.js
          node test_night_lifecycle.js
      - name: Publish reconciled branch
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Reconcile PR29 with current production contracts" || true
          git rm .github/workflows/integrate-pr29.yml
          git commit -m "Remove temporary PR29 integration workflow"
          git push origin HEAD:integrate/pr29-on-main-20260912
